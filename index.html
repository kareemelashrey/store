<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابات المخزن</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--pri:#0f766e;--pri2:#14b8a6;--on:#fff;--bd:#e2e8f0;--bad:#dc2626;--sh:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mut:#94a3b8;--pri:#2dd4bf;--pri2:#14b8a6;--on:#06201c;--bd:#243049;--bad:#f87171;--sh:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:18px;margin:0}header button{background:rgba(255,255,255,.2);color:inherit;border:0;border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);position:sticky;top:0;z-index:5}
nav button{flex:none;border:0;background:var(--card);color:var(--tx);padding:9px 16px;border-radius:12px;font:inherit;cursor:pointer;box-shadow:var(--sh)}nav button.on{background:var(--pri);color:var(--on);font-weight:600}
main{padding:4px 12px 60px;max-width:1100px;margin:auto}h2{font-size:18px;margin:8px 0 12px;border-right:4px solid var(--pri2);padding-right:10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut)}input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-top:3px}
input:focus,select:focus{outline:2px solid var(--pri2);border-color:transparent}
.p{background:var(--pri);color:var(--on);border:0;padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}.s{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:7px 12px;border-radius:10px;font:inherit;cursor:pointer}
.x{color:var(--bad);background:none;border:0;font-size:16px;cursor:pointer}.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th{background:var(--pri);color:var(--on);padding:9px 8px;font-size:13px;white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}td select,td input{min-width:90px;margin:0}
.note{color:var(--mut);font-size:12px}.bad{color:var(--bad);font-weight:700}.tot{font-size:18px;margin-top:10px}.tot b{color:var(--pri)}
.bdg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#15803d;background:color-mix(in srgb,currentColor 14%,transparent)}.bdg.b{color:var(--bad)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--pri);color:var(--on);padding:10px 20px;border-radius:24px;z-index:30}.toast.e{background:var(--bad);color:#fff}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB=supabase.createClient('https://vxyxtjgbpuxybczebrte.supabase.co','sb_publishable_BV4pwYqHNhpgsk_oGHWKNQ_9JIaGAka');
const $=s=>document.querySelector(s),n=v=>+v||0,fmt=v=>n(v).toLocaleString('en',{maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ERR={ERR_NOT_AUTHORIZED:'غير مصرح',ERR_EMPTY_INVOICE:'الفاتورة فاضية',ERR_INVOICE_NOT_FOUND:'الفاتورة غير موجودة',ERR_EDIT_NOT_ALLOWED:'تعديل الفواتير غير مسموح',ERR_EDIT_TODAY_ONLY:'تقدر تعدّل فواتير النهاردة بس',ERR_PRICE_CHANGE_NOT_ALLOWED:'تغيير السعر غير مسموح',ERR_PRICE_BELOW_MIN:'السعر أقل من الحد الأدنى المسموح',ERR_OVER_STOCK:'الكمية أكبر من المتاح بالمخزن',ERR_CREDIT_LIMIT:'الفاتورة تتجاوز حد الائتمان للعميل'};
const msg=e=>{const m=String(e&&e.message||e),k=Object.keys(ERR).find(k=>m.includes(k));return k?ERR[k]:(/duplicate key/.test(m)?'القيمة دي مسجلة قبل كده':m)};
function toast(m,bad){const d=document.createElement('div');d.className='toast'+(bad?' e':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
let me=null,tab='sales',D={items:[],cust:[],wal:[],stock:{}},EDIT=null,LINES=[{}];
const TY={cash:'نقدي',credit:'آجل',wallet:'محفظة'};
function loginView(err){$('#app').innerHTML=`<div class="login"><div class="card"><h2>🧾 تسجيل الدخول</h2><label>الإيميل<input id="em" type="email" autocomplete="username" dir="ltr"></label><label style="margin-top:10px">كلمة السر<input id="pw" type="password" autocomplete="current-password" dir="ltr" onkeydown="if(event.key=='Enter')signIn()"></label><button class="p" style="width:100%" onclick="signIn()">دخول</button>${err?`<p class="bad">${esc(err)}</p>`:''}</div></div>`}
async function signIn(){const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim().toLowerCase(),password:$('#pw').value});if(error)return loginView(/invalid login/i.test(error.message)?'الإيميل أو كلمة السر غلط':'خطأ: '+error.message);boot()}
async function logout(){await SB.auth.signOut();location.reload()}
async function boot(){const{data:{session}}=await SB.auth.getSession();if(!session)return loginView();const{data:p}=await SB.from('profiles').select('name,role').eq('id',session.user.id).maybeSingle();if(!p){await SB.auth.signOut();return loginView('الحساب ده مش مربوط بدور. كلّم المدير.')}me=p;await load();tab='sales';shell()}
async function load(){const[a,b,c,d]=await Promise.all([SB.from('items').select('*').order('code'),SB.from('customers').select('*').order('code'),SB.from('wallets').select('*').order('id'),SB.rpc('get_stock')]);D.items=a.data||[];D.cust=b.data||[];D.wal=c.data||[];D.stock={};(d.data||[]).forEach(x=>D.stock[x.item_id]=n(x.balance))}
const adm=()=>me&&me.role=='admin';
function shell(){const T=[['sales','🛒 مبيعات'],['inv','🧾 الفواتير'],['stock','🏬 المخزون']].concat(adm()?[['items','📦 الأصناف'],['cust','👥 العملاء']]:[]);
$('#app').innerHTML=`<header><h1>🧾 حسابات المخزن</h1><span>${esc(me.name)} · ${adm()?'مدير':'كاشير'} <button onclick="logout()">خروج</button></span></header><nav>${T.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main id="main"></main>`;render()}
function go(t){tab=t;if(t!='sales'){EDIT=null}shell()}
async function render(){const v={sales:salesView,inv:invView,stock:stockView,items:itemsView,cust:custView}[tab];$('#main').innerHTML='<p class="note">جاري التحميل...</p>';$('#main').innerHTML=await v()}
/* ---------- المبيعات ---------- */
function rowsHtml(){return LINES.map((l,i)=>`<tr><td>${i+1}</td><td><select onchange="pick(${i},this.value)"><option value="">-- اختر --</option>${D.items.filter(x=>x.active!==false||x.id==l.item).map(x=>`<option value="${x.id}" ${x.id==l.item?'selected':''}>${esc(x.name)}</option>`).join('')}</select><br><small class="note">${l.item?'المتاح: '+fmt(D.stock[l.item]):''}</small></td><td><input type="number" step="any" inputmode="decimal" value="${l.qty??''}" oninput="setL(${i},'qty',this.value)"></td><td><input type="number" step="any" inputmode="decimal" value="${l.price??''}" oninput="setL(${i},'price',this.value)"></td><td id="lt${i}">${fmt(n(l.qty)*n(l.price))}</td><td><button class="x" onclick="delL(${i})">✕</button></td></tr>`).join('')}
const sumL=()=>LINES.reduce((t,l)=>t+n(l.qty)*n(l.price),0);
function renderLines(){$('#lb').innerHTML=rowsHtml();$('#tot').textContent=fmt(sumL())}
function pick(i,v){const it=D.items.find(x=>x.id==v);LINES[i].item=v;if(it){LINES[i].price=it.sell_price;if(!n(LINES[i].qty))LINES[i].qty=1}renderLines()}
function setL(i,k,v){LINES[i][k]=v;$('#lt'+i).textContent=fmt(n(LINES[i].qty)*n(LINES[i].price));$('#tot').textContent=fmt(sumL())}
function delL(i){LINES.splice(i,1);if(!LINES.length)LINES=[{}];renderLines()}
function addL(){LINES.push({});renderLines()}
function scan(v){v=String(v).trim().toLowerCase();if(!v)return;let m=D.items.filter(x=>String(x.barcode||'').toLowerCase()==v||String(x.code).toLowerCase()==v);if(!m.length)m=D.items.filter(x=>x.name.toLowerCase().includes(v));if(m.length!=1)return toast(m.length?'أكتر من صنف، حدّد أكتر':'مفيش صنف بالاسم ده',1);const it=m[0];let i=LINES.findIndex(l=>l.item==it.id);if(i<0){i=LINES.findIndex(l=>!l.item);if(i<0){LINES.push({});i=LINES.length-1}LINES[i]={item:it.id,qty:0,price:it.sell_price}}LINES[i].qty=n(LINES[i].qty)+1;renderLines()}
function tg(){const t=$('#t').value;$('#wl').style.display=t=='wallet'?'':'none'}
function salesView(){const e=EDIT||{};return`<h2>${EDIT?'تعديل فاتورة رقم '+EDIT.no:'فاتورة بيع جديدة'}</h2><div class="card"><div class="grid"><label>التاريخ<input id="d" type="date" value="${e.date||today()}" ${adm()?'':'disabled'}></label><label>نوع البيع<select id="t" onchange="tg()">${Object.entries(TY).map(([k,v])=>`<option value="${k}" ${e.type==k?'selected':''}>${v}</option>`).join('')}</select></label><label>العميل (للآجل)<select id="c"><option value="">-- بدون --</option>${D.cust.map(x=>`<option value="${x.id}" ${x.id==e.cust?'selected':''}>${esc(x.name)}${x.phone?' - '+esc(x.phone):''}</option>`).join('')}</select></label><label id="wl" style="display:${e.type=='wallet'?'':'none'}">المحفظة<select id="w">${D.wal.map(x=>`<option value="${x.id}" ${x.id==e.wal?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
<label style="margin-top:10px">🔍 باركود / كود / اسم الصنف (Enter للإضافة)<input id="sc" autocomplete="off" onkeydown="if(event.key=='Enter'){scan(this.value);this.value=''}"></label>
<div class="w" style="margin-top:10px"><table><thead><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody id="lb">${rowsHtml()}</tbody></table></div><button class="s" style="margin-top:8px" onclick="addL()">+ سطر</button>
<div class="tot">إجمالي الفاتورة: <b id="tot">${fmt(sumL())}</b></div><button class="p" onclick="saveInv()">💾 ${EDIT?'حفظ التعديل':'حفظ الفاتورة'}</button> ${EDIT?'<button class="s" onclick="EDIT=null;LINES=[{}];go(\'sales\')">إلغاء</button>':''}</div>`}
async function saveInv(){const lines=LINES.filter(l=>l.item).map(l=>({item:l.item,qty:n(l.qty),price:n(l.price)}));if(!lines.length||lines.some(l=>l.qty<=0))return toast('كمّل الأصناف والكميات',1);const type=$('#t').value,cust=$('#c').value||null;if(type=='credit'&&!cust)return toast('اختار العميل للبيع الآجل',1);
const{error}=await SB.rpc('save_invoice',{p_id:EDIT?EDIT.id:null,p_date:$('#d').value||today(),p_type:type,p_customer:cust,p_wallet:type=='wallet'?$('#w').value:null,p_lines:lines});if(error)return toast(msg(error),1);toast('✓ تم الحفظ');EDIT=null;LINES=[{}];await load();render()}
/* ---------- الفواتير ---------- */
let INV=[];
async function invView(){const{data,error}=await SB.from('invoices').select('id,inv_no,inv_date,pay_type,customer_id,wallet_id,invoice_lines(item_id,qty,price)').order('id',{ascending:false}).limit(150);if(error)return`<p class="bad">${esc(msg(error))}</p>`;INV=data;const cn=id=>(D.cust.find(c=>c.id==id)||{}).name||'عميل نقدي';
return`<h2>${adm()?'الفواتير':'فواتير النهاردة'}</h2><div class="card w"><table><tr><th>رقم</th><th>التاريخ</th><th>العميل</th><th>النوع</th><th>الإجمالي</th><th></th></tr>${data.map((r,i)=>`<tr><td>${r.inv_no}</td><td>${r.inv_date}</td><td>${esc(cn(r.customer_id))}</td><td>${TY[r.pay_type]}${r.wallet_id?': '+esc((D.wal.find(w=>w.id==r.wallet_id)||{}).name):''}</td><td>${fmt(r.invoice_lines.reduce((t,l)=>t+l.qty*l.price,0))}</td><td><button class="s" onclick="editInv(${i})">تعديل</button></td></tr>`).join('')||'<tr><td colspan="6" class="note">لا توجد فواتير</td></tr>'}</table></div>`}
function editInv(i){const r=INV[i];EDIT={id:r.id,no:r.inv_no,date:r.inv_date,type:r.pay_type,cust:r.customer_id,wal:r.wallet_id};LINES=r.invoice_lines.map(l=>({item:l.item_id,qty:l.qty,price:l.price}));tab='sales';shell()}
/* ---------- المخزون ---------- */
async function stockView(){const tw=D.items.reduce((t,x)=>t+n(D.stock[x.id]),0);return`<h2>المخزون</h2><div class="card"><b>إجمالي الوزن: ${fmt(tw)} كجم</b></div><div class="card w"><table><tr><th>الكود</th><th>الصنف</th><th>الرصيد (كجم)</th><th>حد الطلب</th><th>الحالة</th></tr>${D.items.map(x=>{const b=n(D.stock[x.id]),st=b<0?'رصيد سالب':b<=n(x.min_qty)?'محتاج طلب':'متوفر';return`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${fmt(b)}</td><td>${fmt(x.min_qty)}</td><td><span class="bdg${st=='متوفر'?'':' b'}">${st}</span></td></tr>`}).join('')}</table></div>`}
/* ---------- الأصناف (مدير) ---------- */
async function itemsView(){const{data}=await SB.from('item_costs').select('*'),C={};(data||[]).forEach(c=>C[c.item_id]=c);
return`<h2>الأصناف</h2><div class="card"><div class="grid">${[['code','الكود'],['name','الاسم'],['bc','الباركود (اختياري)'],['sell','سعر البيع'],['buy','سعر الشراء'],['open','رصيد أول المدة (كجم)'],['min','حد الطلب']].map(([k,l])=>`<label>${l}<input id="i_${k}" ${['sell','buy','open','min'].includes(k)?'type="number" step="any" inputmode="decimal"':''}></label>`).join('')}</div><button class="p" onclick="addItem()">+ إضافة صنف</button></div><div class="card w"><table><tr><th>الكود</th><th>الاسم</th><th>الباركود</th><th>سعر البيع</th><th>سعر الشراء</th><th>الرصيد</th></tr>${D.items.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.barcode||'')}</td><td>${fmt(x.sell_price)}</td><td>${fmt((C[x.id]||{}).buy_price)}</td><td>${fmt(D.stock[x.id])}</td></tr>`).join('')}</table></div>`}
async function addItem(){const g=k=>$('#i_'+k).value.trim();if(!g('code')||!g('name'))return toast('الكود والاسم مطلوبين',1);const{data,error}=await SB.from('items').insert({code:g('code'),name:g('name'),barcode:g('bc')||null,sell_price:n(g('sell')),min_qty:n(g('min'))}).select('id').single();if(error)return toast(msg(error),1);const r=await SB.from('item_costs').insert({item_id:data.id,buy_price:n(g('buy')),open_qty:n(g('open'))});if(r.error)return toast(msg(r.error),1);toast('✓ تمت الإضافة');await load();render()}
/* ---------- العملاء (مدير) ---------- */
async function custView(){const B=await Promise.all(D.cust.map(c=>SB.rpc('customer_balance',{p_c:c.id})));
return`<h2>العملاء</h2><div class="card"><div class="grid">${[['code','الكود'],['name','الاسم'],['phone','التليفون'],['lim','حد الائتمان (0 = بدون حد)'],['open','رصيد أول المدة (مستحق)']].map(([k,l])=>`<label>${l}<input id="u_${k}" ${['lim','open'].includes(k)?'type="number" step="any" inputmode="decimal"':''}></label>`).join('')}</div><button class="p" onclick="addCust()">+ إضافة عميل</button></div><div class="card w"><table><tr><th>الكود</th><th>الاسم</th><th>التليفون</th><th>حد الائتمان</th><th>المستحق</th></tr>${D.cust.map((c,i)=>{const b=n(B[i].data);return`<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.phone||'')}</td><td>${n(c.credit_limit)?fmt(c.credit_limit):'-'}</td><td><b class="${b<0||(n(c.credit_limit)&&b>n(c.credit_limit))?'bad':''}">${fmt(b)}</b></td></tr>`}).join('')}</table></div>`}
async function addCust(){const g=k=>$('#u_'+k).value.trim();if(!g('code')||!g('name')||!g('phone'))return toast('الكود والاسم والتليفون مطلوبين',1);const{data,error}=await SB.from('customers').insert({code:g('code'),name:g('name'),phone:g('phone').replace(/[\s-]/g,''),credit_limit:n(g('lim'))}).select('id').single();if(error)return toast(msg(error),1);if(n(g('open'))){const r=await SB.from('customer_openings').insert({customer_id:data.id,amount:n(g('open'))});if(r.error)return toast(msg(r.error),1)}toast('✓ تمت الإضافة');await load();render()}
boot();
</script></body></html>

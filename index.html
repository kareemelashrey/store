<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابات المخزن</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--pri:#0f766e;--pri2:#14b8a6;--on:#fff;--bd:#e2e8f0;--bad:#dc2626;--sh:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mut:#94a3b8;--pri:#2dd4bf;--pri2:#14b8a6;--on:#06201c;--bd:#243049;--bad:#f87171;--sh:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:18px;margin:0}header button{background:rgba(255,255,255,.2);color:inherit;border:0;border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.lay{display:flex;align-items:flex-start;max-width:1500px;margin:auto}nav{flex:none;width:215px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}.mb,#ov{display:none}
nav button{width:100%;text-align:right;border:0;background:var(--card);color:var(--tx);padding:10px 14px;border-radius:12px;font:inherit;cursor:pointer;box-shadow:var(--sh)}nav button.on{background:var(--pri);color:var(--on);font-weight:600}
main{flex:1;min-width:0;padding:4px 12px 60px}@media(max-width:760px){.mb{display:inline-block}nav{position:fixed;top:0;bottom:0;right:0;width:235px;max-height:none;background:var(--bg);z-index:20;padding-top:64px;transform:translateX(100%);transition:transform .2s;box-shadow:-6px 0 24px rgba(0,0,0,.25)}body.m nav{transform:none}body.m #ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}}h2{font-size:18px;margin:8px 0 12px;border-right:4px solid var(--pri2);padding-right:10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut)}input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-top:3px}
input:focus,select:focus{outline:2px solid var(--pri2);border-color:transparent}
.p{background:var(--pri);color:var(--on);border:0;padding:11px 20px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}.s{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:7px 12px;border-radius:10px;font:inherit;cursor:pointer}
.x{color:var(--bad);background:none;border:0;font-size:16px;cursor:pointer}.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th{background:var(--pri);color:var(--on);padding:9px 8px;font-size:13px;white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}td select,td input{min-width:90px;margin:0}
.note{color:var(--mut);font-size:12px}.bad{color:var(--bad);font-weight:700}.tot{font-size:18px;margin-top:10px}.tot b{color:var(--pri)}
.bdg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#15803d;background:color-mix(in srgb,currentColor 14%,transparent)}.bdg.b{color:var(--bad)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--pri);color:var(--on);padding:10px 20px;border-radius:24px;z-index:30}.toast.e{background:var(--bad);color:#fff}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
@media print{header,nav,#ov,.noprint{display:none!important}.card{box-shadow:none}body{background:#fff;color:#000}}
.doc{background:#fff;color:#000;padding:18px;border-radius:12px;max-width:860px;margin:10px auto;box-shadow:var(--sh)}.doc h2{color:#000}.doc .card{background:none;box-shadow:none;padding:0;color:#000}.doc td{color:#000;border-bottom:1px solid #ddd}.doc th{background:#e5e7eb;color:#000}.doc .note{color:#555}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB=supabase.createClient('https://vxyxtjgbpuxybczebrte.supabase.co','sb_publishable_BV4pwYqHNhpgsk_oGHWKNQ_9JIaGAka');
const $=s=>document.querySelector(s),n=v=>+v||0,fmt=v=>n(v).toLocaleString('en',{maximumFractionDigits:2});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ERR={ERR_NOT_AUTHORIZED:'غير مصرح',ERR_EMPTY_INVOICE:'الفاتورة فاضية',ERR_INVOICE_NOT_FOUND:'الفاتورة غير موجودة',ERR_EDIT_NOT_ALLOWED:'تعديل الفواتير غير مسموح',ERR_EDIT_TODAY_ONLY:'تقدر تعدّل فواتير النهاردة بس',ERR_PRICE_CHANGE_NOT_ALLOWED:'تغيير السعر غير مسموح',ERR_PRICE_BELOW_MIN:'السعر أقل من الحد الأدنى المسموح',ERR_OVER_STOCK:'الكمية أكبر من المتاح بالمخزن',ERR_CREDIT_LIMIT:'الفاتورة تتجاوز حد الائتمان للعميل',ERR_ITEM_INACTIVE:'الصنف موقوف',ERR_BAD_BACKUP:'ملف النسخة الاحتياطية غير صالح'};
const msg=e=>{const m=String(e&&e.message||e),k=Object.keys(ERR).find(k=>m.includes(k));return k?ERR[k]:(/duplicate key/.test(m)?'القيمة دي مسجلة قبل كده':m)};
function toast(m,bad){const d=document.createElement('div');d.className='toast'+(bad?' e':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
let me=null,tab='sales',D={items:[],cust:[],wal:[],stock:{}},EDIT=null,LINES=[{}];
const TY={cash:'نقدي',credit:'آجل',wallet:'محفظة'};
function loginView(err){$('#app').innerHTML=`<div class="login"><div class="card"><h2>🧾 تسجيل الدخول</h2><label>الإيميل<input id="em" type="email" autocomplete="username" dir="ltr"></label><label style="margin-top:10px">كلمة السر<input id="pw" type="password" autocomplete="current-password" dir="ltr" onkeydown="if(event.key=='Enter')signIn()"></label><button class="p" style="width:100%" onclick="signIn()">دخول</button>${err?`<p class="bad">${esc(err)}</p>`:''}</div></div>`}
async function signIn(){const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim().toLowerCase(),password:$('#pw').value});if(error)return loginView(/invalid login/i.test(error.message)?'الإيميل أو كلمة السر غلط':'خطأ: '+error.message);boot()}
async function logout(){await SB.auth.signOut();location.reload()}
async function boot(){const{data:{session}}=await SB.auth.getSession();if(!session)return loginView();const{data:p}=await SB.from('profiles').select('name,role').eq('id',session.user.id).maybeSingle();if(!p){await SB.auth.signOut();return loginView('الحساب ده مش مربوط بدور. كلّم المدير.')}me=p;idle();if(p.role=='admin'){const{data:lb}=await SB.from('settings').select('value').eq('key','last_backup').maybeSingle();LB=lb?lb.value:null}await load();tab='sales';shell()}
async function load(){A=null;const[a,b,c,d]=await Promise.all([SB.from('items').select('*').order('code'),SB.from('customers').select('*').order('code'),SB.from('wallets').select('*').order('id'),SB.rpc('get_stock')]);D.items=a.data||[];D.cust=b.data||[];D.wal=c.data||[];D.stock={};(d.data||[]).forEach(x=>D.stock[x.item_id]=n(x.balance))}
const adm=()=>me&&me.role=='admin';
function shell(){const T=[['sales','🛒 مبيعات'],['inv','🧾 الفواتير'],['stock','🏬 المخزون'+(low().length?' ⚠️'+low().length:'')],['day','📅 ملخص اليوم']].concat(adm()?[['items','📦 الأصناف'],['cust','👥 العملاء'],['buy','🚚 المشتريات'],['pay','💵 دفعات العملاء'],['ret','↩️ المرتجعات'],['spay','🏭 دفعات الموردين'],['exp','🧾 المصروفات'],['cash','🏦 الخزينة واليومية'],['partners','🤝 الشركاء'],['inj','💰 تزويد خارجي'],['ho','📤 التسليم'],['sup','🏭 الموردين'],['wal','👛 المحافظ'],['wd','🔁 سحب المحافظ'],['wt','🔄 تحويل بين المحافظ'],['rep','📊 التقارير'],['log','📜 السجل'],['set','⚙️ الإعدادات'],['bk','💾 نسخة احتياطية']]:[]);
$('#app').innerHTML=`<header><span><button class="mb" onclick="menu()">☰</button> <b>🧾 حسابات المخزن</b></span><span>${esc(me.name)} · ${adm()?'مدير':'كاشير'} <button onclick="logout()">خروج</button></span></header><div id="ov" onclick="menu()"></div><div class="lay"><nav>${T.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><main id="main"></main></div>`;render()}
const menu=()=>document.body.classList.toggle('m');
function go(t){tab=t;if(t!='sales'&&EDIT){EDIT=null;LINES=[{}]}EI=null;EC=null;document.body.classList.remove('m');shell()}
async function render(){const v={sales:salesView,inv:invView,stock:stockView,items:itemsView,cust:custView}[tab]||ADM[tab]||(()=>crud(tab));if(['sales','stock','day'].includes(tab))await rs();$('#main').innerHTML='<p class="note">جاري التحميل...</p>';$('#main').innerHTML=(adm()&&tab!='bk'&&tab!='pv'?bkBanner():'')+await v()}
/* ---------- المبيعات ---------- */
function rowsHtml(){return LINES.map((l,i)=>`<tr><td>${i+1}</td><td><select onchange="pick(${i},this.value)"><option value="">-- اختر --</option>${D.items.filter(x=>x.active!==false||x.id==l.item).map(x=>`<option value="${x.id}" ${x.id==l.item?'selected':''}>${esc(x.name)}</option>`).join('')}</select><br><small class="note">${l.item?'المتاح: '+fmt(D.stock[l.item]):''}</small></td><td><input type="number" step="any" inputmode="decimal" value="${l.qty??''}" oninput="setL(${i},'qty',this.value)"></td><td><input type="number" step="any" inputmode="decimal" value="${l.price??''}" oninput="setL(${i},'price',this.value)"></td><td id="lt${i}">${fmt(n(l.qty)*n(l.price))}</td><td><button class="x" onclick="delL(${i})">✕</button></td></tr>`).join('')}
const sumL=()=>LINES.reduce((t,l)=>t+n(l.qty)*n(l.price),0);
function renderLines(){$('#lb').innerHTML=rowsHtml();$('#tot').textContent=fmt(sumL())}
function pick(i,v){const it=D.items.find(x=>x.id==v);LINES[i].item=v;if(it){LINES[i].price=it.sell_price;if(!n(LINES[i].qty))LINES[i].qty=1}renderLines()}
function setL(i,k,v){LINES[i][k]=v;$('#lt'+i).textContent=fmt(n(LINES[i].qty)*n(LINES[i].price));$('#tot').textContent=fmt(sumL())}
function delL(i){LINES.splice(i,1);if(!LINES.length)LINES=[{}];renderLines()}
function addL(){LINES.push({});renderLines()}
function scan(v){v=String(v).trim().toLowerCase();if(!v)return;let m=D.items.filter(x=>String(x.barcode||'').toLowerCase()==v||String(x.code).toLowerCase()==v);if(!m.length)m=D.items.filter(x=>x.name.toLowerCase().includes(v));if(m.length!=1)return toast(m.length?'أكتر من صنف، حدّد أكتر':'مفيش صنف بالاسم ده',1);const it=m[0];let i=LINES.findIndex(l=>l.item==it.id);if(i<0){i=LINES.findIndex(l=>!l.item);if(i<0){LINES.push({});i=LINES.length-1}LINES[i]={item:it.id,qty:0,price:it.sell_price}}LINES[i].qty=n(LINES[i].qty)+1;renderLines()}
function tg(){const t=$('#t').value;$('#wl').style.display=t=='wallet'?'':'none'}
function salesView(){const e=EDIT||{};return`<h2>${EDIT?'تعديل فاتورة رقم '+EDIT.no:'فاتورة بيع جديدة'}</h2><div class="card"><div class="grid"><label>التاريخ<input id="d" type="date" value="${e.date||today()}" ${adm()?'':'disabled'}></label><label>نوع البيع<select id="t" onchange="tg()">${Object.entries(TY).map(([k,v])=>`<option value="${k}" ${e.type==k?'selected':''}>${v}</option>`).join('')}</select></label><label>العميل (للآجل)<select id="c"><option value="">-- بدون --</option>${D.cust.map(x=>`<option value="${x.id}" ${x.id==e.cust?'selected':''}>${esc(x.name)}${x.phone?' - '+esc(x.phone):''}</option>`).join('')}</select></label><label id="wl" style="display:${e.type=='wallet'?'':'none'}">المحفظة<select id="w">${D.wal.map(x=>`<option value="${x.id}" ${x.id==e.wal?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
<label style="margin-top:10px">🔍 باركود / كود / اسم الصنف (Enter للإضافة)<input id="sc" autocomplete="off" onkeydown="if(event.key=='Enter'){scan(this.value);this.value=''}"></label>
<div class="w" style="margin-top:10px"><table><thead><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody id="lb">${rowsHtml()}</tbody></table></div><button class="s" style="margin-top:8px" onclick="addL()">+ سطر</button>
<div class="tot">إجمالي الفاتورة: <b id="tot">${fmt(sumL())}</b></div><button class="p" onclick="saveInv()">💾 ${EDIT?'حفظ التعديل':'حفظ الفاتورة'}</button> ${EDIT?'<button class="s" onclick="EDIT=null;LINES=[{}];go(\'sales\')">إلغاء</button>':''}</div>`}
let SAV=0;async function saveInv(){if(SAV)return;SAV=1;try{await saveInv0()}finally{SAV=0}}
async function saveInv0(){await rs();const lines=LINES.filter(l=>l.item).map(l=>({item:l.item,qty:n(l.qty),price:n(l.price)}));if(!lines.length||lines.some(l=>l.qty<=0))return toast('كمّل الأصناف والكميات',1);const nd={};lines.forEach(l=>nd[l.item]=(nd[l.item]||0)+l.qty);const ov=Object.keys(nd).filter(k=>nd[k]>n(D.stock[k])+n(EDIT&&EDIT.orig&&EDIT.orig[k])).map(k=>nm.i(k)+' (المتاح '+fmt(n(D.stock[k])+n(EDIT&&EDIT.orig&&EDIT.orig[k]))+')');
if(ov.length)return toast('مينفعش — الكمية أكبر من المتاح بالمخزن: '+ov.join('، '),1)
if(adm()){const lo=lines.filter(l=>{const it=D.items.find(x=>x.id==l.item);return it&&l.price<n(it.min_price)});if(lo.length&&!confirm('سعر البيع أقل من الحد الأدنى المسموح لـ: '+lo.map(l=>D.items.find(x=>x.id==l.item).name).join('، ')+'. تكمل؟'))return}
const type=$('#t').value,cust=$('#c').value||null;if(type=='credit'&&!cust)return toast('اختار العميل للبيع الآجل',1);
const{error}=await SB.rpc('save_invoice',{p_id:EDIT?EDIT.id:null,p_date:$('#d').value||today(),p_type:type,p_customer:cust,p_wallet:type=='wallet'?$('#w').value:null,p_lines:lines});if(error)return toast(msg(error),1);toast('✓ تم الحفظ');EDIT=null;LINES=[{}];await load();render()}
/* ---------- الفواتير ---------- */
let INV=[];
async function invView(){const{data,error}=await SB.from('invoices').select('id,inv_no,inv_date,pay_type,customer_id,wallet_id,invoice_lines(item_id,qty,price)').order('id',{ascending:false}).limit(150);if(error)return`<p class="bad">${esc(msg(error))}</p>`;INV=data;const cn=id=>(D.cust.find(c=>c.id==id)||{}).name||'عميل نقدي';
return`<h2>${adm()?'الفواتير':'فواتير النهاردة'}</h2><div class="card w"><table><tr><th>رقم</th><th>التاريخ</th><th>العميل</th><th>النوع</th><th>الإجمالي</th><th></th></tr>${data.map((r,i)=>`<tr><td>${r.inv_no}</td><td>${r.inv_date}</td><td>${esc(cn(r.customer_id))}</td><td>${TY[r.pay_type]}${r.wallet_id?': '+esc((D.wal.find(w=>w.id==r.wallet_id)||{}).name):''}</td><td>${fmt(r.invoice_lines.reduce((t,l)=>t+l.qty*l.price,0))}</td><td><button class="s" onclick="editInv(${i})">تعديل</button> <button class="s" onclick="prn(${i})">معاينة</button>${adm()?` <button class="x" onclick="delInv(${r.id})">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="note">لا توجد فواتير</td></tr>'}</table></div>`}
function editInv(i){const r=INV[i];EDIT={id:r.id,no:r.inv_no,date:r.inv_date,type:r.pay_type,cust:r.customer_id,wal:r.wallet_id,orig:r.invoice_lines.reduce((o,l)=>(o[l.item_id]=(o[l.item_id]||0)+n(l.qty),o),{})};LINES=r.invoice_lines.map(l=>({item:l.item_id,qty:l.qty,price:l.price}));tab='sales';shell()}
/* ---------- المخزون ---------- */
async function stockView(){const tw=D.items.reduce((t,x)=>t+n(D.stock[x.id]),0);return`<h2>المخزون</h2><button class="p noprint" onclick="stockPv()">🖨 معاينة كشف المخزون</button>${lowBanner()}<div class="card"><b>إجمالي الوزن: ${fmt(tw)} كجم</b></div><input class="noprint" placeholder="🔍 ابحث بالاسم أو الكود أو الباركود" oninput="fltr(this.value,'stk')" style="margin-bottom:8px"><div class="card w"><table id="stk"><tr><th>الكود</th><th>الصنف</th><th>الرصيد (كجم)</th><th>حد الطلب</th><th>الحالة</th>${adm()?'<th></th>':''}</tr>${D.items.map(x=>{const b=n(D.stock[x.id]),st=b<0?'رصيد سالب':b<=n(x.min_qty)?'محتاج طلب':'متوفر';return`<tr data-s="${esc((x.code+' '+x.name+' '+(x.barcode||'')).toLowerCase())}"><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${fmt(b)}</td><td>${fmt(x.min_qty)}</td><td><span class="bdg${st=='متوفر'?'':' b'}">${st}</span></td>${adm()?`<td><button class="s" onclick="ledger('${x.id}')">حركة الصنف</button></td>`:''}</tr>`}).join('')}</table></div>`}
/* ---------- الأصناف (مدير) ---------- */
let EI=null,EC=null,ST=null;const low=()=>D.items.filter(x=>x.active!==false&&n(D.stock[x.id])<=n(x.min_qty));const lowBanner=()=>low().length?`<div class="card"><b class="bad">⚠️ أصناف محتاجة طلب (${low().length}):</b> ${low().map(x=>esc(x.name)+' ('+fmt(D.stock[x.id])+')').join('، ')}</div>`:'';const nextCode=()=>String(Math.max(0,...D.items.map(x=>parseInt(x.code)||0))+1);

let LB=null;const lbDays=()=>LB?Math.floor((Date.now()-new Date(LB))/864e5):null;
const bkBanner=()=>{const d=lbDays();return d!==null&&d<7?'':`<div class="card noprint"><b class="bad">⚠️ ${d===null?'لسه ماخدتش نسخة احتياطية':'آخر نسخة احتياطية من '+d+' يوم'}</b> <button class="s" onclick="go('bk')">خد نسخة دلوقتي</button></div>`};
async function bkView(){const d=lbDays();return`<h2>النسخة الاحتياطية</h2><div class="card"><p>آخر نسخة: <b>${LB?new Date(LB).toLocaleString('en-GB')+' (من '+d+' يوم)':'لا توجد'}</b></p><button class="p" onclick="doBackup()">⬇️ تحميل نسخة كاملة</button><p class="note">بيحمّل ملف واحد فيه كل بياناتك (أصناف، عملاء، فواتير، مشتريات، مصروفات...). احفظه في مكان آمن بره الجهاز: Google Drive أو إيميلك. لو احتجت تسترجعه، ابعت الملف وهتتعمل لك خطوات الاسترجاع. ماتشاركش الملف مع حد، فيه بيانات المحل.</p></div><h2>استرجاع نسخة</h2><div class="card"><p class="note">الاسترجاع <b class="bad">بيستبدل كل بيانات المحل الحالية</b> (أصناف، عملاء، فواتير، مشتريات، مصروفات، محافظ...) بمحتوى الملف. المستخدمين وكلمات السر مابيتغيروش. قبل الاسترجاع بيتحمّل لك تلقائيًا نسخة أمان من البيانات الحالية. لو حصل أي خطأ أثناء الاسترجاع، بياناتك الحالية بتفضل زي ما هي.</p><label>اختار ملف النسخة (.json)<input type="file" accept=".json,application/json" onchange="restoreFile(this)"></label></div>`}
async function restoreFile(inp){const f=inp.files[0];inp.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return toast('الملف مش صالح',1)}
if(!d||d.app!='store-accounting'||!d.tables||!Array.isArray(d.tables.items)||!Array.isArray(d.tables.invoices)||!Array.isArray(d.tables.invoice_lines))return toast('ده مش ملف نسخة احتياطية من البرنامج',1);
const c=k=>(d.tables[k]||[]).length;
if(!confirm('هيتم استبدال كل بيانات المحل الحالية بالنسخة دي:\nتاريخ النسخة: '+String(d.exported_at||'').slice(0,16).replace('T',' ')+'\n'+c('items')+' صنف، '+c('customers')+' عميل، '+c('invoices')+' فاتورة، '+c('purchases')+' مشتريات.\nقبل الاسترجاع هيتحمّل لك تلقائيًا نسخة أمان من البيانات الحالية. تكمل؟'))return;
if(prompt('للتأكيد النهائي اكتب كلمة: استرجاع')!=='استرجاع')return toast('اتلغى الاسترجاع',1);
if(!await doBackup(1))return toast('فشلت نسخة الأمان، اتلغى الاسترجاع',1);
toast('جاري الاسترجاع...');const{data,error}=await SB.rpc('restore_backup',{p_data:d});if(error)return toast(msg(error),1);
A=null;await load();toast('✓ تم الاسترجاع: '+data.items+' صنف، '+data.invoices+' فاتورة');render()}
async function doBackup(pre){toast('جاري تجهيز النسخة...');try{const T=['items','item_costs','customers','customer_openings','wallets','wallet_openings','settings','invoices','invoice_lines','purchases','customer_payments','sale_returns','expenses','supplier_payments','handovers','wallet_withdrawals','day_closes','partners','partner_txns','wallet_transfers','cash_injections','audit_log','profiles'],o={};
for(const t of T){try{o[t]=await all(t,'*',['item_costs','customer_openings','wallet_openings','settings','wallets','profiles','partners'].includes(t)?null:'id')}catch(e){if(!['partners','partner_txns','wallet_transfers','cash_injections'].includes(t))throw e;o[t]=[]}}
const blob=new Blob([JSON.stringify({app:'store-accounting',exported_at:new Date().toISOString(),tables:o})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(pre?'store-before-restore-':'store-backup-')+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
LB=new Date().toISOString();await SB.from('settings').upsert({key:'last_backup',value:LB});toast('✓ تم تحميل النسخة');if(!pre)render();return true}catch(e){toast(msg(e),1);return false}}
function fltr(q,id){q=q.trim().toLowerCase();document.querySelectorAll('#'+id+' tr[data-s]').forEach(r=>r.style.display=!q||r.dataset.s.includes(q)?'':'none')}
async function partnersView(){await need();const P=A.pa.map(p=>{const w=sum(A.pt.filter(t=>t.partner_id==p.id&&t.kind=='withdraw').map(t=>+t.amount)),r=sum(A.pt.filter(t=>t.partner_id==p.id&&t.kind=='return').map(t=>+t.amount));return{...p,w,r,b:w-r}});
return`<h2>الشركاء</h2><div class="card"><div class="grid"><label>اسم الشريك<input id="pn"></label></div><button class="p" onclick="addPartner()">+ إضافة شريك</button></div>`+tb(['الشريك','إجمالي المسحوب','إجمالي المردود','صافي المسحوب (على الشريك)',''],P.map(p=>[esc(p.name),fmt(p.w),fmt(p.r),`<b class="${p.b>0?'bad':''}">${fmt(p.b)}</b>`,`<button class="s" onclick="pstmt('${p.id}')">كشف حساب</button> <button class="x" onclick="delPartner('${p.id}')">✕</button>`]))+await crud('ptx')}
async function addPartner(){const nme=$('#pn').value.trim();if(!nme)return toast('اكتب اسم الشريك',1);const{error}=await SB.from('partners').insert({name:nme});if(error)return toast(msg(error),1);toast('✓ تمت الإضافة');reA()}
async function delPartner(id){if(!confirm('حذف الشريك؟'))return;const{error}=await SB.from('partners').delete().eq('id',id);if(error)return toast(error.code=='23503'?'الشريك عليه حركات فمينفعش يتحذف':msg(error),1);reA()}
async function pstmt(id){await need();const p=A.pa.find(x=>x.id==id),ev=A.pt.filter(t=>t.partner_id==id).sort((a,b)=>a.t_date<b.t_date?-1:a.t_date>b.t_date?1:a.id-b.id);let bal=0;const rows=ev.map(t=>{const w=t.kind=='withdraw'?+t.amount:0,r=t.kind=='return'?+t.amount:0;bal+=w-r;return[t.t_date,esc(t.note||(w?'سحب من الخزينة':'رد للخزينة')),w?fmt(w):'',r?fmt(r):'',fmt(bal)]});pvOpen('كشف حساب الشريك: '+p.name,tb(['التاريخ','البيان','سحب','رد','الرصيد'],rows)+`<p><b>صافي المسحوب على الشريك: ${fmt(bal)}</b></p>`,'partners')}
const ADM={partners:partnersView,bk:bkView,pv:pvView,day:dayView,sup:supView,cash:cashView,wal:walView,rep:repView,log:logView,set:setView};
boot();
</script></body></html>

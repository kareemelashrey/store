async function buyView(){await need();const bt={};A.pu.forEach(p=>{const k=p.batch||('r'+p.id);(bt[k]=bt[k]||{k,rows:[],d:p.p_date,s:p.supplier,t:p.pay_type,no:p.doc_no}).rows.push(p)});const L=Object.values(bt).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0).slice(0,60);
return`<h2>فاتورة مشتريات</h2><div class="card"><div class="grid"><label>التاريخ<input id="bd" type="date" value="${today()}"></label><label>المورد<input id="bs" list="bsl"><datalist id="bsl">${SL().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label><label>طريقة الدفع<select id="bt"><option value="cash">نقدي</option><option value="credit">آجل</option></select></label><label>رقم فاتورة المورد (اختياري)<input id="bn"></label></div><div class="w" style="margin-top:10px"><table><thead><tr><th>الصنف</th><th>الكمية (كجم)</th><th>سعر الشراء</th><th>الإجمالي</th><th></th></tr></thead><tbody id="plb">${plRows()}</tbody></table></div><button class="s" style="margin-top:8px" onclick="PL.push({});$('#plb').innerHTML=plRows()">+ سطر</button><div class="tot">إجمالي الفاتورة: <b id="ptot">${fmt(plSum())}</b></div><button class="p" onclick="savePurchase()">💾 حفظ فاتورة المشتريات</button></div>`+tb(['التاريخ','المورد','رقم الفاتورة','الأصناف','الإجمالي','النوع',''],L.map(b=>[b.d,esc(b.s||''),esc(b.no||''),esc(b.rows.map(r=>nm.i(r.item_id)+' '+fmt(r.qty)).join('، ').slice(0,70)),fmt(sum(b.rows.map(r=>r.qty*r.price))),b.t=='credit'?'آجل':'نقدي',`<button class="x" onclick="delBatch('${b.k}')">✕</button>`]))+'<p class="note">كل فاتورة مشتريات ممكن فيها أصناف كتير ورقم فاتورة المورد. الحذف بيمسح الفاتورة كلها (وبيتسجّل في السجل). المشتريات بتزوّد المخزون على طول.</p>'}
async function savePurchase(){const lines=PL.filter(l=>l.item);if(!lines.length||lines.some(l=>!(n(l.qty)>0)||!(n(l.price)>=0)))return toast('كمّل الأصناف والكميات والأسعار',1);const sup=$('#bs').value.trim(),t=$('#bt').value;if(t=='credit'&&!sup)return toast('اكتب اسم المورد للشراء الآجل',1);const batch=uid(),d=$('#bd').value||today(),no=$('#bn').value.trim()||null;
const{error}=await SB.from('purchases').insert(lines.map(l=>({p_date:d,item_id:l.item,qty:n(l.qty),price:n(l.price),supplier:sup||null,pay_type:t,doc_no:no,batch})));if(error)return toast(msg(error),1);PL=[{}];await reA();toast('✓ تم حفظ فاتورة المشتريات ('+lines.length+' صنف)')}
async function delBatch(k){if(!confirm('حذف فاتورة المشتريات كلها؟'))return;const q=k[0]=='r'?SB.from('purchases').delete().eq('id',+k.slice(1)):SB.from('purchases').delete().eq('batch',k);const{error}=await q;if(error)return toast(msg(error),1);reA()}
/* ----- الشيكات ----- */
const dueChq=()=>A&&A.ck?A.ck.filter(c=>c.status=='pending'&&c.due_date<=iso(dd(today())+7*DAY)).length:0;
async function chqView(){await need();const t=today(),P=A.ck.filter(c=>c.status=='pending'),L=A.ck.slice().sort((a,b)=>(a.status=='pending'?0:1)-(b.status=='pending'?0:1)||(a.due_date<b.due_date?-1:1)).slice(0,120),ck=D.wal.find(w=>w.kind=='check'),
wo=sel=>D.wal.map(w=>`<option value="${w.id}" ${sel&&w.id==sel?'selected':''}>${esc(w.name)}</option>`).join(''),
st=c=>c.status=='collected'?'<span class="bdg">متحصّل</span>':c.status=='bounced'?'<span class="bdg b">مرتد</span>':c.due_date<t?'<span class="bdg b">متأخر</span>':c.due_date<=iso(dd(t)+7*DAY)?'<span class="bdg b">قريب</span>':'<span class="bdg" style="color:var(--mute)">معلّق</span>';
return`<h2>الشيكات</h2><div class="grid"><div class="card"><b>${fmt(sum(P.map(c=>+c.amount)))}</b><br><span class="note">إجمالي الشيكات المعلّقة (${P.length})</span></div><div class="card"><b class="${dueChq()?'bad':''}">${dueChq()}</b><br><span class="note">مستحق أو يستحق خلال 7 أيام</span></div></div><div class="card"><div class="grid"><label>رقم الشيك<input id="cn"></label><label>البنك<input id="cb"></label><label>العميل<select id="cc"><option value="">-- بدون --</option>${D.cust.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>المبلغ<input id="ca" type="number" step="any" inputmode="decimal"></label><label>تاريخ الاستحقاق<input id="cd" type="date" value="${t}"></label><label>الحساب اللي الشيك فيه<select id="cw">${wo(ck&&ck.id)}</select></label><label>ملاحظات<input id="cx"></label></div><button class="p" onclick="addChq()">+ تسجيل شيك</button><p class="note">تسجيل الشيك هنا للمتابعة (الاستحقاق والحالة). الفلوس نفسها بتدخل حساب الشيكات من البيع أو التحصيل.</p></div><div class="card"><label>عند التحصيل حوّل الفلوس إلى<select id="cto"><option value="">الخزنة النقدية</option>${wo()}</select></label></div>`+tb(['الرقم','البنك','العميل','المبلغ','الاستحقاق','الحالة','الحساب',''],L.map(c=>[esc(c.cheque_no||''),esc(c.bank||''),esc(nm.c(c.customer_id)||'—'),fmt(c.amount),c.due_date,st(c),esc(nm.w(c.wallet_id)||'—'),c.status=='pending'?`<button class="p" style="margin:0" onclick="chqCollect(${c.id})">تحصيل</button> <button class="s" onclick="chqBounce(${c.id})">مرتد</button> <button class="x" onclick="delChq(${c.id})">✕</button>`:`<button class="x" onclick="delChq(${c.id})">✕</button>`]))+'<p class="note">«تحصيل» بينقل المبلغ من حساب الشيك للخزنة (أو للحساب اللي اخترته) ويقفل الشيك. «مرتد» بيشيل المبلغ من الحساب ويقفل الشيك، ورجّع مديونية العميل بإيدك لو لزم.</p>'}
async function addChq(){const amt=+$('#ca').value;if(!(amt>0))return toast('اكتب المبلغ',1);if(!$('#cd').value)return toast('اكتب تاريخ الاستحقاق',1);const{error}=await SB.from('cheques').insert({cheque_no:$('#cn').value.trim()||null,bank:$('#cb').value.trim()||null,customer_id:$('#cc').value||null,amount:amt,due_date:$('#cd').value,wallet_id:$('#cw').value||null,note:$('#cx').value.trim()||null});if(error)return toast(msg(error),1);toast('✓ تم تسجيل الشيك');reA()}
async function chqCollect(id){const to=$('#cto').value||null;if(!confirm('تحصيل الشيك؟ المبلغ هيتحوّل '+(to?'للحساب المختار':'للخزنة النقدية')+'.'))return;const{error}=await SB.rpc('cheque_collect',{p_id:id,p_to:to});if(error)return toast(msg(error),1);await reA();toast('✓ تم تحصيل الشيك')}
async function chqBounce(id){if(!confirm('تسجيل الشيك كمرتد؟ المبلغ هيتشال من حساب الشيك.'))return;const{error}=await SB.rpc('cheque_bounce',{p_id:id});if(error)return toast(msg(error),1);await reA();toast('✓ اتسجّل كمرتد')}
async function delChq(id){if(!confirm('حذف الشيك من السجل؟ (مابيعدّلش الأرصدة)'))return;const{error}=await SB.from('cheques').delete().eq('id',id);if(error)return toast(msg(error),1);reA()}
/* ----- المستخدمون ----- */
async function usersView(){const{data,error}=await SB.rpc('list_users');if(error)return`<p class="bad">${esc(msg(error))}</p><p class="note">لو الرسالة بتقول إن الدالة مش موجودة، شغّل ملف schema_update16.sql في Supabase.</p>`;
return`<h2>المستخدمون</h2><div class="card"><div class="grid"><label>الاسم<input id="un"></label><label>الإيميل<input id="ue" type="email" dir="ltr"></label><label>كلمة السر (8 حروف على الأقل)<input id="up" type="password" dir="ltr" autocomplete="new-password"></label><label>الصلاحية<select id="ur"><option value="cashier">كاشير</option><option value="admin">مدير</option></select></label></div><button class="p" onclick="addUser()">+ إضافة مستخدم</button></div>`+tb(['الاسم','الإيميل','الصلاحية','الحالة','آخر دخول',''],data.map(u=>[esc(u.name),`<span dir="ltr">${esc(u.email)}</span>`,u.role=='admin'?'مدير':'كاشير',u.active?'<span class="bdg">نشط</span>':'<span class="bdg b">موقوف</span>',u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleDateString('en-GB'):'—',u.id==ME_ID?'<span class="note">حسابك</span>':`<button class="s" onclick="uPass('${u.id}')">كلمة سر جديدة</button> <button class="s" onclick="uActive('${u.id}',${!u.active})">${u.active?'إيقاف':'تفعيل'}</button> <button class="s" onclick="uRole('${u.id}','${u.role=='admin'?'cashier':'admin'}')">${u.role=='admin'?'خفض لكاشير':'ترقية لمدير'}</button>`]))+'<p class="note">المستخدم الموقوف مايقدرش يدخل فورًا. غيّر كلمة سر أي مستخدم من هنا لو نسيها.</p>'}
async function addUser(){const{error}=await SB.rpc('admin_create_user',{p_email:$('#ue').value,p_password:$('#up').value,p_name:$('#un').value,p_role:$('#ur').value});if(error)return toast(msg(error),1);toast('✓ تم إنشاء المستخدم');render()}
async function uPass(id){const v=prompt('اكتب كلمة السر الجديدة (8 حروف على الأقل)');if(!v)return;const{error}=await SB.rpc('admin_set_password',{p_user:id,p_password:v});if(error)return toast(msg(error),1);toast('✓ تم تغيير كلمة السر')}
async function uActive(id,a){if(!confirm(a?'تفعيل المستخدم؟':'إيقاف المستخدم؟'))return;const{error}=await SB.rpc('admin_set_active',{p_user:id,p_active:a});if(error)return toast(msg(error),1);render()}
async function uRole(id,r){if(!confirm('تغيير الصلاحية؟'))return;const{error}=await SB.rpc('admin_set_role',{p_user:id,p_role:r});if(error)return toast(msg(error),1);render()}
const ADM={buy:buyView,chq:chqView,users:usersView,home:homeView,partners:partnersView,emps:empView,stt:sttView,bk:bkView,pv:pvView,day:dayView,sup:supView,cash:cashView,wal:walView,rep:repView,log:logView,set:setView};
boot();
</script></body></html>
